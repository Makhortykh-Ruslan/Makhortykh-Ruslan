name: Update years of experience

on:
  schedule:
    - cron: '0 6 1 * *' # 1st of every month, 06:00 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate years since career start
        run: |
          CAREER_START="2021-04-01" # first commercial role (TAS)
          YEARS=$(( ( $(date +%s) - $(date -d "$CAREER_START" +%s) ) / 31557600 ))
          sed -i -E "s|<!--YEARS-->[^<]*<!--/YEARS-->|<!--YEARS-->${YEARS}+<!--/YEARS-->|" README.md
          echo "Computed: ${YEARS}+"

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No change — years still current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update years of experience"
          git push
